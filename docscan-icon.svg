<!-- DocScan AI のアプリアイコン。
     原本: DocScanAI/promo/assets/brand/Origami_Straight_D_Blue.svg
     変更点: viewBox のみ。図形（D）の外接矩形 x125-375 / y110-490 の中心を
             ビューポート中心に合わせ、高さの 93% を占めるようにした。
             原本は 500x500 中で図形が 250x380 しかなく、余白が大きすぎた。
             影は右下へ伸びるため、影の範囲まで含めて中央に寄せると図形が左上にずれる。
     図形の定義は原本のまま。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="45.5 95.5 409 409" width="409" height="409">
  <defs>
    <linearGradient id="gradFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A9CF4"/>
      <stop offset="100%" stop-color="#1A73E8"/>
    </linearGradient>
    <linearGradient id="gradBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3A76"/>
      <stop offset="100%" stop-color="#1A3A6B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g transform="translate(-25, 10)">
    <!-- BACK PIECES -->
    <polygon points="150,100 320,100 400,180 230,180" fill="url(#gradBack)" />
    <polygon points="150,480 320,480 400,400 230,400" fill="url(#gradBack)" />
    <!-- FRONT PIECES -->
    <polygon points="150,100 230,180 230,400 150,480" fill="url(#gradFront)" filter="url(#shadow)" />
    <polygon points="320,100 400,180 400,400 320,480" fill="url(#gradFront)" filter="url(#shadow)" />
  </g>
</svg>
